
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f3f4f6;
            margin: 0;
            padding: 60px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px 20px;
            border-radius: 15px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>
        <p>This website is deployed using GitHub and Vercel.</p>
        <button onclick="alert('Hello! Your website works!')">
            Click Me
        </button>
    </div>
</body>
</html>
